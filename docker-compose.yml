services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-calendly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-calendly}
      POSTGRES_DB: ${POSTGRES_DB:-calendly}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-calendly} -d ${POSTGRES_DB:-calendly}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-calendly}:${POSTGRES_PASSWORD:-calendly}@db:5432/${POSTGRES_DB:-calendly}
      RUN_MIGRATIONS_ON_BOOT: "true"
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

  # Local email sink for development: `docker compose --profile dev up`
  # Web UI on http://localhost:8025, SMTP on 1025.
  mailpit:
    image: axllent/mailpit:latest
    profiles: ["dev"]
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
